name: Sync Bookings from Airbnb

# ── When this runs ───────────────────────────────────────────
on:
  schedule:
    # Every hour, on the hour
    - cron: '0 * * * *'
  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:

# Only one sync at a time — never let two runs race on the same file.
concurrency:
  group: sync-bookings
  cancel-in-progress: false

# Needed so the job can commit the refreshed bookings.js back to the repo.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # 1. Check out the repo (script + js/ folder + last-known-good bookings.js)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Refresh bookings.js from the Airbnb calendars.
      #    The script exits non-zero (and leaves bookings.js untouched) if any
      #    feed fails, so a broken/expired feed makes THIS step fail loudly
      #    instead of silently publishing an empty calendar. When it fails,
      #    the commit and deploy steps below are skipped and the live site
      #    keeps its last-known-good availability.
      - name: Fetch Airbnb calendars and update bookings.js
        env:
          AIRBNB_DOUBLE_ROOM: ${{ secrets.AIRBNB_DOUBLE_ROOM }}
          AIRBNB_TWIN_1:      ${{ secrets.AIRBNB_TWIN_1 }}
          AIRBNB_TWIN_2:      ${{ secrets.AIRBNB_TWIN_2 }}
          AIRBNB_APARTMENT:   ${{ secrets.AIRBNB_APARTMENT }}
          GOOGLE_CALENDAR:    ${{ secrets.GOOGLE_CALENDAR }}
        run: python3 sync-bookings.py

      # 4. Commit the refreshed file back so git stays the single source of
      #    truth (any later cPanel/WinSCP deploy ships the current data too).
      #    Only commits when availability actually changed — no-op runs make
      #    no commits.
      - name: Commit refreshed bookings.js
        run: |
          if git diff --quiet -- js/bookings.js; then
            echo "No availability change — nothing to commit."
          else
            git config user.name  "tamariu-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add js/bookings.js
            git commit -m "Sync availability from Airbnb [skip ci]"
            git push
          fi

      # 5. Sync the ./js folder to iFastNet via FTPS. The action diffs against
      #    its server-side state file and only transfers files whose contents
      #    changed, so in practice each run ships just:
      #      - bookings.js     the availability data (only when it changed)
      #      - sync-status.js  the heartbeat the website badge reads (every run)
      #    sync-status.js is generated into ./js by the step above, so it is
      #    present at upload time even though it is git-ignored.
      #    NOTE: this action has no working "include"/whitelist — it syncs the
      #    whole local-dir — so we deliberately do not try to restrict it.
      - name: Deploy availability files to iFastNet
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ${{ secrets.FTP_SERVER }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          protocol:    ftps          # secure FTP — use 'ftp' if this fails
          port:        21
          local-dir:   ./js/
          server-dir:  /public_html/js/
          log-level:   minimal
